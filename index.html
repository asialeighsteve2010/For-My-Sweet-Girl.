<!DOCTYPE html>
<html>
<head>
<title>Private Website</title>

<style>
body {
  background: #111111;
  font-family: Georgia, serif;
  text-align: center;
  padding-top: 120px;
}

.box {
  background: #f7f0f8;
  border-radius: 8px;
  width: 320px;
  margin: auto;
  padding: 35px;
  box-shadow: 0 5px 20px #aaa;
}

h1 {
  letter-spacing: 6px;
    font-family: Georgia, serif;
  font-weight: normal;
  color: #6b2c7a;
}

input {
  padding: 12px;
  width: 200px;
  margin: 15px;
}
 button {
  padding: 12px 30px;
  cursor: pointer;
  background: #6b2c7a;
  color: white;
  border: none;
  border-radius: 4px;
  font-family: Georgia, serif;
  letter-spacing: 2px;
}

#error {
  color: #a00;
}
</style>
</head>

<body>

<div class="box">
  <h1>PRIVATE</h1>
  <p>Enter the password to continue</p>

  <input type="password" id="password" placeholder="Password">
  <br>

  <button onclick="checkPassword()">ENTER</button>

  <p id="error"></p>
</div>

<script>
function checkPassword() {
  var password = document.getElementById("password").value;

  if (password === "july9th") {
    window.location.href = "home.html";
  } else {
    document.getElementById("error").innerHTML =
      "Incorrect password.";
  }
}
</script>

</body>
</html>
