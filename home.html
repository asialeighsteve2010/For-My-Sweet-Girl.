<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Space</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  font-family: Arial, sans-serif;
}

/* WHOLE WEBSITE */

.page {
  width: 98%;
  max-width: 1400px;
  margin: 15px auto;
  background: #f8f5f8;
  border: 8px solid #6b2c7a;
}

/* HEADER */

.header {
  background: #ead9ed;
  text-align: center;
  padding: 25px 10px;
  border-bottom: 5px solid #6b2c7a;
}

.header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-weight: normal;
  letter-spacing: 8px;
  font-size: 38px;
  color: #5b216c;
}

.subtitle {
  margin-top: 8px;
  color: #777;
  font-family: Georgia, serif;
}

/* NAVIGATION */

.nav {
  margin-top: 15px;
}

.nav a {
  display: inline-block;
  background: #6b2c7a;
  color: white;
  text-decoration: none;
  padding: 9px 18px;
  margin: 3px;
  font-size: 12px;
  letter-spacing: 1px;
}

.nav a:hover {
  opacity: 0.75;
}

/* MAIN LAYOUT */

.gallery {
  display: grid;

  /*
     SMALL PHOTO COLUMNS
     BIG CENTRE
  */

  grid-template-columns:
    95px
    95px
    minmax(500px, 4fr)
    95px
    95px;

  gap: 12px;
  padding: 18px;
  align-items: start;
}

/* PHOTO COLUMNS */

.side {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.photo {
  width: 100%;
  height: 90px;
  object-fit: cover;

  border: 4px solid #6b2c7a;

  background: #ddd;

  display: block;

  transition: transform 0.2s;
}

.photo:hover {
  transform: scale(1.04);
}

/* CENTRE */

.main {
  width: 100%;
  min-width: 0;
  text-align: center;
}

/* HUGE VIDEO BOX */

.video-box {
  width: 100%;

  background: #111111;

  border: 8px solid #6b2c7a;

  padding: 7px;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.3);
}

video {
  display: block;

  width: 100%;

  height: auto;

  max-height: 650px;

  background: black;
}

.arrows {
  margin: 16px 0;
}
