<!DOCTYPE html>
<html>
<head>
<title>My Space</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: Arial, sans-serif;
}

.page {
  width: 90%;
  max-width: 1100px;
  margin: 30px auto;
  background: white;
  border: 8px solid #7b22a8;
  min-height: 700px;
}

.header {
  background: #eee;
  padding: 15px;
  text-align: center;
  color: #5b147d;
  font-size: 28px;
  font-weight: bold;
}

.content {
  display: flex;
  gap: 15px;
  padding: 15px;
}

.side {
  width: 120px;
}

.side img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  margin-bottom: 12px;
  border: 4px solid #7b22a8;
}

.main {
  flex: 1;
  text-align: center;
}

.main img {
  width: 100%;
  max-height: 500px;
  object-fit: cover;
  border: 5px solid #7b22a8;
}

.arrow {
  font-size: 35px;
  color: #7b22a8;
  cursor: pointer;
  margin: 15px;
}

.footer {
  text-align: center;
  padding: 15px;
  color: #777;
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    MY SPACE
  </div>

  <div class="content">

    <div class="side">
      <img src="https://placehold.co/300x200?text=Photo">
      <img src="https://placehold.co/300x200?text=Photo">
      <img src="https://placehold.co/300x200?text=Photo">
    </div>

    <div class="main">
      <span class="arrow">◀</span>

      <img src="https://placehold.co/800x500?text=My+Photo">

      <span class="arrow">▶</span>

      <h2>Welcome to my space</h2>
      <p>A little place for my photos, memories and everything I love.</p>
    </div>

    <div class="side">
      <img src="https://placehold.co/300x200?text=Photo">
      <img src="https://placehold.co/300x200?text=Photo">
      <img src="https://placehold.co/300x200?text=Photo">
    </div>

  </div>

  <div class="footer">
    © My Space
  </div>

</div>

</body>
</html>
